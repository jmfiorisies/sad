site_name: Organización

theme:
  name: material
  language: es
  
  # Iconos de la interfaz y del logo
  icon:
    logo: material/palette-swatch
    repo: fontawesome/brands/github

  # Características visuales y de navegación
  features:
    - navigation.top           # Botón flotante para volver arriba
    - navigation.instant       # Carga instantánea tipo SPA
    - search.suggest           # Sugerencias visuales en la búsqueda
    - search.highlight         # Resaltado en color de las palabras buscadas
    - content.code.copy        # Botón para copiar bloques de código

  # Configuración de colores y selector Claro / Oscuro
  palette:
    # Opción 1: Modo Claro
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Pasar a modo oscuro

    # Opción 2: Modo Oscuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Pasar a modo claro

markdown_extensions:
  - md_in_html
  - admonition
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
  - https://unpkg.com/mermaid@10/dist/mermaid.min.js

extra_css:
  - stylesheets/extra.css

plugins:
  - search



